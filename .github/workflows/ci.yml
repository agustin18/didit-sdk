name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check uv lockfile consistency
        run: uv lock --check

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

  type-check:
    name: Type Safety (Mypy Strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Type check with mypy
        run: uv run mypy src/didit

  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run test suite with 100% coverage gate
        run: uv run pytest --cov=didit --cov-report=xml --cov-report=term-missing

  build:
    name: Build & Package Validation
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build package distributions
        run: uv build

      - name: Verify build artifacts exist
        run: |
          ls -la dist/
          test -f dist/didit_sdk-*.tar.gz
          test -f dist/didit_sdk-*-py3-none-any.whl

      - name: Smoke test built wheel in clean virtual environment
        run: |
          uv venv --clear /tmp/smoke-wheel-env
          uv pip install --python /tmp/smoke-wheel-env/bin/python dist/didit_sdk-*-py3-none-any.whl
          /tmp/smoke-wheel-env/bin/python -c "import didit; assert didit.__version__ == '0.4.0'"
          /tmp/smoke-wheel-env/bin/didit --version
          /tmp/smoke-wheel-env/bin/didit --help

      - name: Smoke test built sdist in clean virtual environment
        run: |
          uv venv --clear /tmp/smoke-sdist-env
          uv pip install --python /tmp/smoke-sdist-env/bin/python dist/didit_sdk-*.tar.gz
          /tmp/smoke-sdist-env/bin/python -c "import didit; assert didit.__version__ == '0.4.0'"
          /tmp/smoke-sdist-env/bin/didit --version

