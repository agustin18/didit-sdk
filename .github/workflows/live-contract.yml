name: Live Contract & Sandbox Matrix

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Specific sandbox scenario to test (or 'all')"
        required: false
        default: "all"
  schedule:
    # Run weekly on Monday at 04:00 UTC
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-matrix:
    name: Contract Matrix & Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Contract Matrix Tests
        run: uv run pytest tests/test_contract_matrix.py tests/test_v020_compatibility.py -v

      - name: Verify CLI Sandbox Scenarios
        run: uv run didit sandbox scenarios --json
