[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "didit-sdk"
version = "0.2.0"
description = "Unofficial Python SDK for Didit (didit.me) Identity Verification & KYC"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Agustin Saiz", email = "agustinsaiz02@gmail.com" }
]
keywords = [
    "didit",
    "kyc",
    "identity-verification",
    "biometrics",
    "fastapi",
    "django",
    "flask",
    "sdk",
    "webhooks"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.scripts]
didit = "didit.cli:main"

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
]
django = [
    "django>=5.2",
]
flask = [
    "flask>=3.1",
]
redis = [
    "redis>=5.0",
]
all = [
    "fastapi>=0.100.0",
    "django>=5.2",
    "flask>=3.1",
    "redis>=5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "fastapi>=0.100.0",
    "httpx>=0.25.0",
    "django>=5.2",
    "flask>=3.1",
    "redis>=5.0",
]

[project.urls]
Homepage = "https://github.com/agustin18/didit-sdk"
Documentation = "https://github.com/agustin18/didit-sdk#readme"
Repository = "https://github.com/agustin18/didit-sdk"
Issues = "https://github.com/agustin18/didit-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/didit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]
exclude = [
    ".roadmap.md",
    ".audit",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/didit"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
